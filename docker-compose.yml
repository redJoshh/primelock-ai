services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: primelock_postgres
    environment:
      POSTGRES_USER: "kjdaprime"
      POSTGRES_PASSWORD: "@tienzaPrime425"
      POSTGRES_DB: "primelock_db"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: primelock_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata: