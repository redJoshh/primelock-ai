name: Feature Request
description: Propose a new capability or architectural enhancement for PrimeLock AI.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The Problem / Business Value
      description: What is the context? Why do we need this feature?
      placeholder: "When a user does X, they currently cannot do Y..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work from a technical perspective?
      placeholder: "We should create a new REST endpoint that..."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What conditions must be met for this feature to be considered "Done"?
      value: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
