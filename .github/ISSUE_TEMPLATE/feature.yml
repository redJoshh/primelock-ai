name: Feature
description: New feature or user story
title: "[FEATURE] "
labels: ["type: feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be built and why
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Checklist of what "done" looks like
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Mobile-Frontend
        - Mobile-Backend
        - Web-Backend
        - Web-Frontend
        - Integration/FCM
        - Docs
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Must-have
        - Should-have
        - Could-have
    validations:
      required: true
  - type: dropdown
    id: sprint
    attributes:
      label: Sprint
      description: Which sprint is this targeted for
      options:
        - Sprint 1
        - Sprint 2
        - Sprint 3
        - Sprint 4
        - Sprint 5
        - Sprint 6
        - Backlog / Unscheduled
    validations:
      required: false
