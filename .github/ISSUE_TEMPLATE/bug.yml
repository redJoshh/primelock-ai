name: Bug Report
description: Report an error or unexpected behavior in the system.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to trigger the issue.
      value: |
        1. Go to '...'
        2. Send a POST request to '...' with payload '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Stacktrace / Logs
      description: Paste any relevant terminal errors or Spring Boot stacktraces here.
      render: java
  - type: input
    id: environment
    attributes:
      label: Environment
      description: e.g., Docker Desktop v4.28, Windows 11 WSL2, Java 21
    validations:
      required: true
