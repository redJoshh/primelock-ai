name: Bug
description: Encountered problems
title: "[BUG] "
labels: ["type: bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be fixed and why
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce-and-solution
    attributes:
      label: steps-to-reproduce-and-solution
      description: Checklist of what "done" looks like
      placeholder: |
        - [ ] Step 1
        - [ ] Step 2
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Mobile-Frontend
        - Mobile-Backend
        - Web-Backend
        - Web-Frontend
        - Integration/FCM
        - Docs
    validations:
      required: true

  - type: dropdown
    id: sprint
    attributes:
      label: Sprint
      description: Which sprint is this targeted for
      options:
        - Sprint 1
        - Sprint 2
        - Sprint 3
        - Sprint 4
        - Backlog / Unscheduled
    validations:
      required: false
