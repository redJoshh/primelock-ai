name: Testing / QA
description: Manual test pass, test case, or QA verification task — not a bug report itself, but the act of checking something
title: "[TEST] "
labels: ["type: test"]
body:
  - type: textarea
    id: scope
    attributes:
      label: What's being tested
      description: Feature, screen, or flow under test
      placeholder: e.g. Verify OSG/OSA can create and publish a broadcast, and it appears on student mobile feed
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Test Steps
      description: Step-by-step actions to perform
      placeholder: |
        1. Log in as OSG publisher
        2. Create a new broadcast
        3. Publish it
        4. Check student app receives push notification
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: What should happen if it works correctly
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Result
      description: What actually happened (fill in after running the test)
      placeholder: Leave blank until the test is run
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment / Device
      options:
        - Android Emulator
        - Physical Android Device
        - Web (Chrome)
        - Web (Other Browser)
        - Backend/API only
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Mobile-Frontend
        - Mobile-Backend
        - Web-Backend
        - Web-Frontend
        - Integration/FCM
        - Docs
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: Pass / Fail
      description: Set this after running the test. If Fail, open a separate Bug issue and link it here.
      options:
        - Not yet run
        - Pass
        - Fail
    validations:
      required: false
