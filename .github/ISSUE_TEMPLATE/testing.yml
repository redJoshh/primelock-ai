name: Test Plan
description: Define testing scope for a specific module or feature.
labels: ["qa"]
body:
  - type: textarea
    id: scope
    attributes:
      label: Testing Scope
      description: Which endpoints, services, or UI components are being tested?
    validations:
      required: true
  - type: textarea
    id: scenarios
    attributes:
      label: Test Scenarios (Given-When-Then)
      description: Outline the specific paths to validate.
      value: |
        **Scenario 1: Happy Path**
        - Given: [precondition]
        - When: [action]
        - Then: [expected result]
        
        **Scenario 2: Edge Case**
        - Given: [precondition]
        - When: [action]
        - Then: [expected result]
    validations:
      required: true
