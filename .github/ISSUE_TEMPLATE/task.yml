name: Technical Task
description: A backend chore, refactoring, or infrastructure update.
labels: ["chore"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What technical debt are we paying down or what subsystem are we building?
    validations:
      required: true
  - type: textarea
    id: task-list
    attributes:
      label: Task Checklist
      description: Break down the work into actionable steps.
      value: |
        - [ ] Step 1
        - [ ] Step 2
    validations:
      required: true
