name: Task / Chore
description: One-off setup, admin, or maintenance task (not a feature or bug) — e.g., "Set up GitHub repo", "Configure branch protection", "Set up FCM project"
title: "[TASK] "
labels: ["type: chore"]
body:
  - type: textarea
    id: description
    attributes:
      label: What needs to be done
      description: Describe the task clearly enough that anyone on the team could pick it up
      placeholder: e.g. Create the ust-archways repo, add mobile/cms/docs folders, invite collaborators
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps / Checklist
      description: Break it into checkable steps if it has more than one part
      placeholder: |
        - [ ] Step 1
        - [ ] Step 2
        - [ ] Step 3
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Mobile
        - Web-Backend
        - Web-Frontend
        - Integration/FCM
        - Docs
        - Repo/Infrastracture
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Must-have
        - Should-have
        - Could-have
        - Docs & Infrastracture
    validations:
      required: true

  - type: dropdown
    id: sprint
    attributes:
      label: Sprint
      description: Which sprint is this targeted for
      options:
        - Sprint 1
        - Sprint 2
        - Sprint 3
        - Sprint 4
        - Backlog / Unscheduled
    validations:
      required: true
